[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protoskipper"
version = "0.0.1"
description = "Open-source SCADA & BMS protocol testing, probing, and commissioning toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "DataSailors Pvt Ltd", email = "hello@datasailors.io" },
]
maintainers = [
    { name = "DataSailors Pvt Ltd", email = "hello@datasailors.io" },
]
keywords = [
    "scada", "bms", "modbus", "iec61850", "iec104", "bacnet",
    "industrial-control", "ot", "substation", "automation",
    "protocol-testing", "commissioning",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

dependencies = [
    # Core has no third-party deps beyond stdlib + a tiny crypto lib for audit signing.
    # Protocol stacks are pulled in via optional extras so a user installing only the
    # core (or a single protocol) doesn't have to drag in the rest.
    "cryptography>=42",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
modbus = [
    "pymodbus>=3.6",
    "pyserial>=3.5",
]
iec104 = [
    # placeholder — lib60870 cffi bindings come later
]
bacnet = [
    "bacpypes3>=0.0.98",
]
iec61850 = [
    "pyiec61850>=1.5.2a1; sys_platform == 'linux'",
]
all = [
    "protoskipper[gui,modbus,iec104,bacnet,iec61850]",
]
dev = [
    # Exact pins prevent silent tool upgrades from changing the quality bar.
    # Update deliberately: bump version, run full test suite, commit.
    # NOTE: pytest-qt is NOT here — it registers itself as a plugin at import
    # time and requires a Qt binding even for non-GUI test runs. Add
    # protoskipper[dev-gui] when you need to run tests/gui/.
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "mypy==1.11.2",
    "build==1.4.0",
    "pre-commit==4.6.0",
]
dev-gui = [
    # Adds Qt GUI test support on top of [dev].
    # Must be installed alongside [gui] so PySide6 is present.
    "protoskipper[dev]",
    "pytest-qt==4.5.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
protoskipper = "protoskipper.cli:main"
protoskipper-gui = "protoskipper.gui.app:main"

# ---------------------------------------------------------------------------
# Plugin discovery: third-party protocol drivers register themselves here.
#
# A plugin package's own pyproject.toml declares, e.g.:
#
#     [project.entry-points."protoskipper.protocols"]
#     dnp3 = "protoskipper_dnp3.driver:DNP3Driver"
#
# At startup, protoskipper.core.plugin_loader discovers every entry point
# in the "protoskipper.protocols" group and registers the driver class.
# Built-in drivers below use the same mechanism — there is no privileged
# registration path, so a community plugin is a first-class citizen.
# ---------------------------------------------------------------------------
[project.entry-points."protoskipper.protocols"]
"modbus.tcp" = "protoskipper.builtin_drivers.modbus.driver:ModbusTcpDriver"
"modbus.rtu" = "protoskipper.builtin_drivers.modbus.driver:ModbusRtuDriver"

# GUI panel contributions (per-protocol custom views) use a separate group
# so a headless install never has to import Qt.
[project.entry-points."protoskipper.gui_contributions"]
# (populated by gui-aware plugins; built-in drivers ship their own contributions later)

[project.urls]
Homepage = "https://protoskipper.dev"
Documentation = "https://protoskipper.dev/docs"
Source = "https://github.com/datasailors/protoskipper"
Issues = "https://github.com/datasailors/protoskipper/issues"
Changelog = "https://github.com/datasailors/protoskipper/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protoskipper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that exercise real sockets/serial; require pymodbus.",
    "gui: tests that require a running QApplication and PySide6.",
]
# Suppress the pymodbus v4 migration deprecation warnings globally so that
# individual test files do not need module-level warnings.filterwarnings() calls
# (which force E402 import ordering violations).
filterwarnings = [
    "ignore:.*deprecated and will be removed in v4.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    # Qt overrides require camelCase method names; ruff cannot know these are
    # inherited virtual methods. Suppress globally for the Qt GUI layer.
    "N802",
    # Exception names ConnectionFailure / UnsupportedOperation / AuthorizationDenied
    # are part of the public API - renaming would break callers.
    "N818",
    # QModelIndex() as a default argument is the standard Qt pattern for
    # optional parent arguments in model methods.
    "B008",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["protoskipper"]

[[tool.mypy.overrides]]
module = [
    "protoskipper.gui.*",
    "protoskipper.builtin_drivers.*",
]
# PySide6 and pymodbus ship incomplete stubs that cause false positives.
# The core layer (protoskipper.core.*) keeps full strict checking.
ignore_errors = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["protoskipper"]
omit = [
    # GUI entry points and theme module are exercised by GUI tests (Phase 0.B),
    # not by the unit-only run.
    "*/gui/*",
    "*/builtin_drivers/*",
]

[tool.coverage.report]
# Threshold applied to the core layer only (unit tests alone can reach this).
# The overall threshold is raised after GUI tests land in Phase 0.B.
fail_under = 80
show_missing = true
skip_covered = false
