id: tridium_niagara
display_name: "Tridium Niagara Framework (JACE / Supervisor)"
vendor_id: 24
quirks:
  - reboot-on-cov-cancel
default_apdu_timeout_ms: 6000
rpm_batch_size: 16
cov_lifetime_s: 300
segmentation_supported: true
proprietary_object_types: []
proprietary_properties:
  - property_id: 3001
    name: "NIA-Slot-Path"
    object_types:
      - analog-input
      - analog-output
      - analog-value
      - binary-input
      - binary-output
      - binary-value
      - multi-state-input
      - multi-state-output
      - multi-state-value
    data_type: "characterstring"
    description: "Niagara internal slot path (e.g. /Station/AHU1/SATempSensor)"
  - property_id: 3002
    name: "NIA-Facets"
    object_types:
      - analog-value
      - binary-value
    data_type: "characterstring"
    description: "Niagara facets string (JSON-like descriptor)"
notes: |
  Tridium Niagara Framework (vendor_id 24) powers JACE, Supervisor, and
  hundreds of OEM controllers (Honeywell WEBs-N4, Distech ECLYPSE, etc.).
  IMPORTANT: On some Niagara 4.x versions, cancelling a COV subscription
  before it expires can trigger a supervisor restart.  Issue COV
  subscriptions with short lifetimes (≤ 300 s) and let them expire naturally
  rather than explicitly cancelling them.
  The "slot-path" proprietary property provides the full Niagara component
  hierarchy and is useful for operator context.
