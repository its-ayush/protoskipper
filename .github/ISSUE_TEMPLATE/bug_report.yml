name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** check the [existing issues](https://github.com/its-ayush/protoskipper/issues) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: ProtoSkipper version
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.4"
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol involved
      options:
        - Modbus TCP
        - Modbus RTU
        - Not protocol-specific
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to device at ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / traceback
      description: Run with `protoskipper-gui` from a terminal and paste any errors.
      render: text

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a security vulnerability (use security@datasailors.io for that).
          required: true
