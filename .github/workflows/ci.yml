name: CI

on:
  push:
    branches: [master, main, develop, "release/**"]
  pull_request:
    branches: [master, main, develop]

# Cancel in-flight runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint + type check
  # Runs on a single OS/Python combo — there is no platform-specific logic
  # in ruff or mypy for this project.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev deps
        # [all] pulls in gui (PySide6) so mypy can see Qt stubs.
        # [dev-gui] adds pytest-qt for completeness (not strictly needed for lint).
        run: pip install -e ".[all,dev,dev-gui]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format (check only)
        run: ruff format --check src/ tests/

      - name: mypy
        run: mypy src/

  # ---------------------------------------------------------------------------
  # Job 2: Unit tests
  # Matrix covers all supported Python versions × all supported OS.
  # Unit tests have zero network requirements and run in < 5 s.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps
        # No [gui] or [dev-gui] here — pytest-qt requires a Qt binding even
        # for non-GUI test runs, so it must not be present in the unit job.
        # On Windows / macOS: skip iec61850 (Linux-only) and gui (large).
        run: pip install -e ".[modbus,dev]"

      - name: pytest (unit) with coverage
        run: >
          pytest tests/unit/
          --cov=protoskipper
          --cov-config=pyproject.toml
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          -q

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job 3: Integration tests (Linux only — requires real sockets)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[modbus,dev]"

      - name: pytest (integration)
        run: pytest tests/integration/ -q --tb=short -m integration

  # ---------------------------------------------------------------------------
  # Job 4: GUI tests (Linux, needs virtual display)
  # Skipped when PySide6 cannot load or no display is available.
  # ---------------------------------------------------------------------------
  gui:
    name: GUI tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system display deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libgl1-mesa-dri \
            libxcb1 libx11-xcb1 xvfb

      - name: Install deps
        run: pip install -e ".[gui,modbus,dev,dev-gui]"

      - name: pytest (GUI) under Xvfb
        run: >
          xvfb-run --auto-servernum
          pytest tests/gui/ -q --tb=short -m gui --timeout=60
        env:
          QT_QPA_PLATFORM: xcb

  # ---------------------------------------------------------------------------
  # Sentinel job — the ONLY check to add to branch protection rules.
  # It fans in all matrix + downstream jobs so branch protection never needs
  # to list individual matrix variants (which change when the matrix changes).
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI pass
    if: always()
    needs: [lint, unit, integration, gui]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [name for name, job in needs.items() if job['result'] not in ('success', 'skipped')]
          if failed:
              print('Failed jobs:', failed)
              sys.exit(1)
          print('All jobs passed or were skipped.')
          "
